<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a1a">
    <title>Statistics - Quest Tracker</title>
    <link rel="manifest" href="manifest.json?v=5">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        (function() {
            var savedTheme = localStorage.getItem('active_theme') || 'default';
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.id = 'themeStylesheet';
            var themeFile = (savedTheme === 'custom') ? 'custom-theme.css' : 'theme-' + savedTheme + '.css';
            link.href = 'css/' + themeFile + '?_=' + Date.now();
            document.head.appendChild(link);
        })();
    </script>
    <script src="theme-loader.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--dark-grey); color: var(--cream); }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 2px solid var(--jade); padding-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
        .header h1 { color: var(--jade); font-size: 2rem; }
        .nav-back button, .reload-btn, .logout-btn { background: var(--dark-grey-3); color: var(--cream); border: 1px solid var(--olive); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: var(--dark-grey-2); padding: 1rem; border-radius: 12px; text-align: center; border-left: 4px solid var(--jade); }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 0.75rem; color: var(--olive-light); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.25rem; }
        .stat-sub { font-size: 0.7rem; color: var(--success); margin-top: 0.25rem; }
        .graph-container, .daily-log-container { background: var(--dark-grey-2); border-radius: 12px; padding: 1rem; margin-bottom: 2rem; }
        .graph-container h2, .daily-log-container h2 { color: var(--jade); font-size: 1.25rem; margin-bottom: 1rem; }
        canvas { max-height: 300px; width: 100%; }
        .day-group { background: var(--dark-grey-3); border-radius: 10px; margin-bottom: 1rem; overflow: hidden; }
        .day-header {
            background: var(--jade-dark);
            padding: 0.75rem 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .day-header-left {
            flex: 1;
            text-align: left;
        }
        .day-header-left h3 {
            font-size: 1rem;
            margin: 0;
            color: var(--cream);
            font-weight: 600;
        }
        .day-stats-center {
            flex: 2;
            display: flex;
            justify-content: center;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--olive-light);
            flex-wrap: wrap;
        }
        .day-stats-center span {
            white-space: nowrap;
        }
        .day-toggle {
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            margin-left: 0.5rem;
        }
        .day-content { padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .day-content.hidden { display: none; }
        .quest-log-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0.75rem;
            background: var(--dark-grey-2);
            border-radius: 8px;
            border-left: 4px solid var(--olive);
            flex-wrap: wrap;
        }
        .quest-log-item.completed {
            background: color-mix(in srgb, var(--success) 10%, transparent);
            border-left-color: var(--success);
            opacity: 0.8;
        }
        .quest-status-icon { font-size: 1.1rem; min-width: 1.8rem; text-align: center; }
        .quest-log-info { flex: 1; min-width: 150px; }
        .quest-log-name { font-weight: 500; }
        .quest-log-details { font-size: 0.7rem; color: var(--olive-light); }
        .quest-type-tag {
            font-size: 0.65rem;
            background: var(--dark-grey-3);
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            color: var(--olive-light);
            border: 1px solid var(--dark-grey);
            text-transform: lowercase;
            font-weight: normal;
            letter-spacing: 0.3px;
        }
        .quest-log-points {
            background: var(--jade);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .empty-state { text-align: center; color: var(--olive-light); padding: 2rem; }
        .error { color: #d62828; text-align: center; padding: 1rem; }
        .login-box { background: var(--dark-grey-2); border-radius: 12px; padding: 2rem; max-width: 400px; margin: 2rem auto; text-align: center; }
        .login-box input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; background: var(--dark-grey); border: 1px solid var(--dark-grey-3); border-radius: 6px; color: var(--cream); }
        .login-box button { width: 100%; padding: 0.75rem; background: var(--jade); color: var(--dark-grey); border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .hidden { display: none; }
        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .day-header { flex-direction: column; align-items: stretch; }
            .day-header-left, .day-stats-center, .day-toggle { text-align: center; flex: auto; }
            .day-stats-center { justify-content: center; }
            .day-toggle { margin-top: 0.25rem; margin-left: 0; }
            .quest-log-item { flex-wrap: wrap; }
            .quest-type-tag { order: 2; }
            .quest-log-points { order: 3; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header" id="statsHeader" style="display: none;">
        <div class="nav-back"><button onclick="window.location.href='index.html'">← Back to Login</button></div>
        <div><h1>📊 Statistics</h1></div>
        <div>
            <button class="reload-btn" onclick="location.reload()">🔄 Refresh</button>
            <button class="logout-btn" onclick="stats.logout()">🚪 Logout</button>
        </div>
    </div>

    <div id="loginSection" class="login-box">
        <h3>🔐 Enter Access Code</h3>
        <input type="password" id="accessCode" placeholder="Access code">
        <button onclick="stats.checkAccess()">View Stats</button>
        <div id="loginError" class="error"></div>
    </div>

    <div id="statsSection" class="hidden">
        <div class="stats-grid" id="statsGrid"></div>

        <div class="graph-container">
            <h2>📈 Daily Points (Last 30 Days)</h2>
            <canvas id="activityChart" width="400" height="200"></canvas>
        </div>

        <div class="daily-log-container">
            <h2>📋 Daily Quest Log (Last 30 Days)</h2>
            <div id="dailyLogContainer">Loading...</div>
        </div>
    </div>
</div>

<script>
    const stats = {
        accessCode: null,
        chart: null,
        historyData: [],
        quests: [],
        loginExpiryDays: 30,

        formatDate(dateStr) {
            if (!dateStr) return '';
            let d = new Date(dateStr);
            if (isNaN(d.getTime())) {
                const parts = dateStr.split('-');
                if (parts.length === 3) {
                    d = new Date(Date.UTC(parts[0], parts[1]-1, parts[2]));
                }
            }
            if (isNaN(d.getTime())) return dateStr;
            const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${weekdays[d.getUTCDay()]} ${months[d.getUTCMonth()]} ${String(d.getUTCDate()).padStart(2,'0')} ${d.getUTCFullYear()}`;
        },

        getTodayUTC() {
            const now = new Date();
            return `${now.getUTCFullYear()}-${String(now.getUTCMonth()+1).padStart(2,'0')}-${String(now.getUTCDate()).padStart(2,'0')}`;
        },

        getDateNDaysAgoUTC(daysAgo) {
            const d = new Date();
            d.setUTCDate(d.getUTCDate() - daysAgo);
            return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
        },

        daysBetween(date1Str, date2Str) {
            const [y1, m1, d1] = date1Str.split('-').map(Number);
            const [y2, m2, d2] = date2Str.split('-').map(Number);
            const ts1 = Date.UTC(y1, m1-1, d1);
            const ts2 = Date.UTC(y2, m2-1, d2);
            return Math.floor((ts1 - ts2) / (1000 * 60 * 60 * 24));
        },

        hasValidLogin() {
            const saved = localStorage.getItem('stats_authenticated');
            if (!saved) return false;
            try {
                const data = JSON.parse(saved);
                const expiry = data.timestamp + (this.loginExpiryDays * 24 * 60 * 60 * 1000);
                return Date.now() < expiry;
            } catch(e) { return false; }
        },
        saveLogin() { localStorage.setItem('stats_authenticated', JSON.stringify({ timestamp: Date.now() })); },
        clearLogin() { localStorage.removeItem('stats_authenticated'); },

        // Fetch the access code from server (no header needed – public endpoint)
        async fetchAccessCode() {
            try {
                const res = await fetch('api.php?action=stats_access_code');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                this.accessCode = data.code;
                localStorage.setItem('stats_access_code', this.accessCode);
                return true;
            } catch(e) {
                document.getElementById('loginError').innerHTML = '❌ Could not load access code. Try again.';
                return false;
            }
        },

        // Wrapper that adds the stats code header (only after accessCode is known)
        async fetchWithStatsCode(endpoint, options = {}) {
            if (!this.accessCode) {
                // Try localStorage first
                const saved = localStorage.getItem('stats_access_code');
                if (saved) {
                    this.accessCode = saved;
                } else {
                    // This should not happen if fetchAccessCode was called first
                    throw new Error('Access code not loaded');
                }
            }
            options.headers = options.headers || {};
            options.headers['X-Stats-Access-Code'] = this.accessCode;
            return fetch(endpoint, options);
        },

        async checkAccess(bypassCache = false) {
            if (!bypassCache && this.hasValidLogin()) {
                await this.showStatsSection();
                return;
            }
            // Ensure we have the code from the server
            const ok = await this.fetchAccessCode();
            if (!ok) return;

            const enteredCode = document.getElementById('accessCode').value;
            if (enteredCode === this.accessCode) {
                this.saveLogin();
                await this.showStatsSection();
            } else {
                document.getElementById('loginError').innerHTML = '❌ Incorrect access code';
            }
        },

        async showStatsSection() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('statsSection').classList.remove('hidden');
            document.getElementById('statsHeader').style.display = 'flex';
            await this.loadData();
        },

        logout() { this.clearLogin(); location.reload(); },

        async loadData() {
            try {
                // Now accessCode is set, we can use fetchWithStatsCode
                const histRes = await this.fetchWithStatsCode('api.php?action=history');
                if (!histRes.ok) throw new Error('Failed history');
                const histData = await histRes.json();
                this.historyData = histData.history || [];

                const mainRes = await this.fetchWithStatsCode('api.php');
                if (!mainRes.ok) throw new Error('Failed quests');
                const mainData = await mainRes.json();
                this.quests = mainData.quests || [];

                this.quests = this.quests.map(q => {
                    if (q.days_visible && typeof q.days_visible === 'string') {
                        try { q.days_visible = JSON.parse(q.days_visible); } catch(e) { q.days_visible = null; }
                    }
                    if (q.specific_dates && typeof q.specific_dates === 'string') {
                        try { q.specific_dates = JSON.parse(q.specific_dates); } catch(e) { q.specific_dates = null; }
                    }
                    if (!q.days_visible && q.schedule && !q.schedule.includes('/') && !q.schedule.includes('every other') && !q.schedule.includes('&')) {
                        const dayNames = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
                        const scheduleDay = q.schedule.charAt(0).toUpperCase() + q.schedule.slice(1).toLowerCase();
                        if (dayNames.includes(scheduleDay)) {
                            q.days_visible = [scheduleDay];
                            q.schedule = 'Daily';
                        }
                    }
                    return q;
                });

                const statsData = this.computeStats(this.historyData);
                this.renderStats(statsData);
                this.renderActivityGraph(this.historyData);
                await this.renderDailyQuestLog();
            } catch(e) {
                console.error(e);
                document.getElementById('statsGrid').innerHTML = '<div class="error">❌ Failed to load data</div>';
            }
        },

        computeStats(history) {
            const totalEarned = history.filter(h => h.points > 0).reduce((s, h) => s + h.points, 0);
            const currentPoints = history.reduce((s, h) => s + h.points, 0);
            const todayStr = this.getTodayUTC();
            const todayPoints = history.filter(h => h.date === todayStr && h.points > 0).reduce((s, h) => s + h.points, 0);
            const totalRewards = history.filter(h => h.type === 'reward_redeem').length;
            const latestReward = history.filter(h => h.type === 'reward_redeem').sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp))[0];
            const activeDays = new Set(history.filter(h => h.type === 'quest_complete').map(h => h.date)).size;
            const streak = this.calculateStreak(history);
            return { totalEarned, currentPoints, todayPoints, totalRewards, latestReward, activeDays, streak };
        },

        calculateStreak(history) {
            const normaliseDate = (dateStr) => {
                if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
                const d = new Date(dateStr);
                if (!isNaN(d.getTime())) {
                    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
                }
                return null;
            };
            const dates = [...new Set(history.filter(h => h.type === 'quest_complete')
                .map(h => normaliseDate(h.date))
                .filter(d => d))];
            if (!dates.length) return 0;
            dates.sort().reverse();
            let streak = 1;
            for (let i = 1; i < dates.length; i++) {
                const diff = this.daysBetween(dates[i-1], dates[i]);
                if (diff === 1) streak++;
                else break;
            }
            return streak;
        },

        renderStats(stats) {
            const latestRewardText = stats.latestReward ?
                `${stats.latestReward.description.split('Redeemed ')[1] || 'Reward'} on ${this.formatDate(stats.latestReward.date)}` :
                'None yet';
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card"><div class="stat-value">${stats.activeDays}</div><div class="stat-label">Days Active</div></div>
                <div class="stat-card"><div class="stat-value">${stats.streak}</div><div class="stat-label">Current Streak</div></div>
                <div class="stat-card"><div class="stat-value">${stats.totalEarned}</div><div class="stat-label">Total Points Earned</div></div>
                <div class="stat-card"><div class="stat-value">${stats.currentPoints}</div><div class="stat-label">Current Points</div></div>
                <div class="stat-card"><div class="stat-value">${stats.todayPoints}</div><div class="stat-label">Points Today</div></div>
                <div class="stat-card"><div class="stat-value">${stats.totalRewards}</div><div class="stat-label">Rewards Redeemed</div><div class="stat-sub">${latestRewardText}</div></div>
            `;
        },

        renderActivityGraph(history) {
            const pointsByDate = new Map();
            for (let i = 0; i < 30; i++) {
                const key = this.getDateNDaysAgoUTC(i);
                pointsByDate.set(key, 0);
            }
            history.forEach(h => {
                if (h.points > 0 && pointsByDate.has(h.date)) {
                    pointsByDate.set(h.date, pointsByDate.get(h.date) + h.points);
                }
            });
            const labels = Array.from(pointsByDate.keys()).reverse();
            const dataPoints = Array.from(pointsByDate.values()).reverse();

            const ctx = document.getElementById('activityChart').getContext('2d');
            if (this.chart) this.chart.destroy();

            const barColor = getComputedStyle(document.documentElement).getPropertyValue('--success').trim() || '#52b788';
            const borderColor = getComputedStyle(document.documentElement).getPropertyValue('--jade').trim() || '#4a7c59';
            const textColor = getComputedStyle(document.documentElement).getPropertyValue('--olive-light').trim() || '#8a9968';
            const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--dark-grey-3').trim() || '#3a3a3a';

            this.chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels.map(d => this.formatDate(d)),
                    datasets: [{
                        label: 'Points Earned',
                        data: dataPoints,
                        backgroundColor: barColor,
                        borderColor: borderColor,
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { labels: { color: textColor } },
                        tooltip: { callbacks: { label: (ctx) => `${ctx.raw} points` } }
                    },
                    scales: {
                        x: { ticks: { color: textColor, maxRotation: 45, autoSkip: true, maxTicksLimit: 8 } },
                        y: { ticks: { color: textColor, stepSize: 1 }, grid: { color: gridColor } }
                    }
                }
            });
        },

        async getVisibleQuestsForDate(dateStr) {
            try {
                const res = await this.fetchWithStatsCode(`api.php?action=visible_quests&date=${dateStr}`);
                if (res.ok) {
                    const data = await res.json();
                    return data.quests || [];
                }
            } catch(e) {
                console.warn(`Failed to fetch visible quests for ${dateStr}`, e);
            }
            return [];
        },

        sortQuestsByReminderTime(quests) {
            return [...quests].sort((a, b) => {
                const toMinutes = (t) => {
                    if (!t) return -1;
                    const m = t.match(/(\d+):(\d+)\s*(am|pm)/i);
                    if (!m) return Infinity;
                    let h = parseInt(m[1]);
                    const min = parseInt(m[2]);
                    const ap = m[3].toLowerCase();
                    if (ap === 'pm' && h !== 12) h += 12;
                    if (ap === 'am' && h === 12) h = 0;
                    return h*60 + min;
                };
                const minsA = toMinutes(a.reminder_time);
                const minsB = toMinutes(b.reminder_time);
                if (minsA !== minsB) return minsA - minsB;
                return a.name.localeCompare(b.name);
            });
        },

        async renderDailyQuestLog() {
            const container = document.getElementById('dailyLogContainer');
            container.innerHTML = '<div class="empty-state">📅 Loading daily log...</div>';

            const days = [];
            for (let i = 29; i >= 0; i--) {
                days.push(this.getDateNDaysAgoUTC(i));
            }

            const daysData = [];
            for (const date of days) {
                try {
                    // ── Completions from history (source of truth — includes deleted quests) ──
                    const historyCompleted = this.historyData.filter(
                        h => h.date === date && h.type === 'quest_complete'
                    );
                    const historyCompletedNames = new Set(
                        historyCompleted.map(h => h.description.replace(/^Completed quest:\s*/i, '').trim())
                    );

                    // ── Visible quests for this date (currently-existing quests only) ──
                    const visibleQuests = await this.getVisibleQuestsForDate(date);

                    // ── Completion status for visible quests ──
                    const compRes = await this.fetchWithStatsCode(`api.php?action=completions&date=${date}`);
                    const compData = compRes.ok ? await compRes.json() : {};
                    const completions = compData.completions || {};

                    // ── Build quest list ──
                    // 1. Visible quests with completion status
                    const visibleItems = visibleQuests.map(q => ({
                        id: q.id,
                        name: q.name,
                        points: q.points || 1,
                        type: q.type || 'side',
                        reminder_time: q.reminder_time || null,
                        completed: completions[q.id]?.completed === true
                    }));

                    // 2. Completed quests from history NOT in the visible list (deleted quests)
                    const visibleNames = new Set(visibleQuests.map(q => q.name));
                    const deletedItems = historyCompleted
                        .filter(h => {
                            const name = h.description.replace(/^Completed quest:\s*/i, '').trim();
                            return !visibleNames.has(name);
                        })
                        .map(h => ({
                            id: null,
                            name: h.description.replace(/^Completed quest:\s*/i, '').trim(),
                            points: h.points || 1,
                            type: 'deleted',
                            reminder_time: null,
                            completed: true
                        }));

                    // Sort: calendar first, then main, then side, then deleted; by reminder time within groups
                    const typeOrder = { calendar: 0, main: 1, side: 2, deleted: 3 };
                    const allQuestItems = [...visibleItems, ...deletedItems].sort((a, b) => {
                        const tA = typeOrder[a.type] ?? 99, tB = typeOrder[b.type] ?? 99;
                        if (tA !== tB) return tA - tB;
                        return this.sortQuestsByReminderTime([a, b])[0] === a ? -1 : 1;
                    });

                    const otherItems = this.historyData.filter(h =>
                        h.date === date && (h.type === 'achievement' || h.type === 'reward_redeem' || h.type === 'bonus')
                    ).sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

                    const dayPoints = this.historyData.filter(h => h.date === date && h.points > 0).reduce((s, h) => s + h.points, 0);
                    const completedCount = allQuestItems.filter(q => q.completed).length;
                    const rewardCount = otherItems.filter(h => h.type === 'reward_redeem').length;
                    const achievementCount = otherItems.filter(h => h.type === 'achievement').length;

                    daysData.push({ date, quests: allQuestItems, otherItems, totalPoints: dayPoints, completedCount, rewardCount, achievementCount });
                } catch(e) {
                    console.warn(`Failed for ${date}`, e);
                    daysData.push({ date, quests: [], otherItems: [], totalPoints: 0, completedCount: 0, rewardCount: 0, achievementCount: 0, error: true });
                }
            }

            daysData.reverse();

            if (daysData.length === 0 || daysData.every(d => d.quests.length === 0 && d.otherItems.length === 0 && d.totalPoints === 0)) {
                container.innerHTML = '<div class="empty-state">📭 No activity data available.</div>';
                return;
            }

            let html = '';
            for (const day of daysData) {
                const dateFormatted = this.formatDate(day.date);

                const questsHtml = day.quests.map(quest => {
                    const icon = quest.completed ? '✅' : '❌';
                    const completedClass = quest.completed ? 'completed' : '';
                    const reminderHtml = quest.reminder_time ? `⏰ ${quest.reminder_time}` : '';
                    let typeLabel = quest.type || '';
                    let tagStyle = '';
                    if (quest.type === 'deleted') {
                        typeLabel = 'deleted';
                        tagStyle = 'style="opacity:0.5;"';
                    }
                    return `
                        <div class="quest-log-item ${completedClass}">
                            <div class="quest-status-icon">${icon}</div>
                            <div class="quest-log-info">
                                <div class="quest-log-name">${this.escapeHtml(quest.name)}</div>
                                <div class="quest-log-details">${reminderHtml}</div>
                            </div>
                            <span class="quest-type-tag" ${tagStyle}>${typeLabel}</span>
                            <div class="quest-log-points">${quest.points} pts</div>
                        </div>
                    `;
                }).join('');

                const otherHtml = day.otherItems.map(item => {
                    let icon = item.type === 'achievement' ? '🏆' : item.type === 'reward_redeem' ? '🍫' : item.type === 'bonus' ? '✨' : '📝';
                    let typeLabel = item.type === 'achievement' ? 'achievement' : item.type === 'reward_redeem' ? 'reward' : item.type === 'bonus' ? 'bonus' : 'other';
                    return `
                        <div class="quest-log-item" style="border-left-color: var(--accent);">
                            <div class="quest-status-icon">${icon}</div>
                            <div class="quest-log-info">
                                <div class="quest-log-name">${this.escapeHtml(item.description)}</div>
                                <div class="quest-log-details"></div>
                            </div>
                            <span class="quest-type-tag">${typeLabel}</span>
                            <div class="quest-log-points">${item.points} pts</div>
                        </div>
                    `;
                }).join('');

                const noContentHtml = (day.quests.length === 0 && day.otherItems.length === 0)
                    ? '<div class="empty-state">✨ No activity this day.</div>' : '';

                html += `
                    <div class="day-group">
                        <div class="day-header" onclick="stats.toggleDay(this)">
                            <div class="day-header-left"><h3>${dateFormatted}</h3></div>
                            <div class="day-stats-center">
                                <span>✅ ${day.completedCount}</span>
                                <span>⭐️ +${day.totalPoints}</span>
                                <span>🪙 ${day.rewardCount}</span>
                                <span>🔔 ${day.achievementCount}</span>
                            </div>
                            <div class="day-toggle">▼</div>
                        </div>
                        <div class="day-content">
                            ${questsHtml}
                            ${otherHtml}
                            ${noContentHtml}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        },

        toggleDay(header) {
            const content = header.nextElementSibling;
            const toggle = header.querySelector('.day-toggle');
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                toggle.textContent = '▼';
            } else {
                content.classList.add('hidden');
                toggle.textContent = '▶︎';
            }
        },

        escapeHtml(str) {
            return String(str || '').replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        },

        init() {
            if (this.hasValidLogin()) {
                this.showStatsSection();
            }
        }
    };

    stats.init();
</script>
</body>
</html>
